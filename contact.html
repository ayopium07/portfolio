<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Ayotope</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Exo", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Inter", "Helvetica Neue", Arial, sans-serif;
        background-color: #1a1d24;
        color: #ffffff;
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Navigation */
      .navbar {
        background-color: #1a1d24;
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 1.5rem 8%;
        border-bottom: 1px solid #a0a0a0;
      }

      .nav-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        display: flex;
        align-items: center;
        text-decoration: none;
      }

      .logo-img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        border: 2px solid #2196f3;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }

      .nav-links a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: #2196f3;
      }

      /* Main Content */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 8%;
        display: flex;
        gap: 4rem;
        align-items: center;
      }

      .contact-left {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .contact-image {
        width: 100%;
        max-width: 500px;
        height: auto;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .contact-right {
        flex: 1;
        text-align: left;
      }

      .page-title {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 1rem;
        color: #ffffff;
        text-align: left;
      }

      .page-subtitle {
        font-size: 1.1rem;
        color: #ffffff;
        margin-bottom: 3rem;
        max-width: 100%;
        font-weight: 400;
        text-align: left;
      }

      .contact-form {
        background-color: transparent;
        border: none;
        padding: 0;
        text-align: left;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #ffffff;
        font-weight: 500;
        font-size: 1rem;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 1rem;
        background-color: #2a2d34;
        border: 1px solid #2a2d34;
        border-radius: 8px;
        color: #ffffff;
        font-size: 1rem;
        transition: all 0.3s;
      }

      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: #a0a0a0;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #2196f3;
        background-color: #2a2d34;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 120px;
      }

      .submit-btn {
        background-color: #2196f3;
        color: #ffffff;
        border: none;
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        width: auto;
        float: right;
        margin-top: 1rem;
      }

      .submit-btn:hover {
        background-color: #1976d2;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.25);
      }

      /* Footer */
      .footer {
        background-color: #1a1d24;
        border-top: 1px solid #a0a0a0;
        padding: 2rem 8%;
        text-align: center;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .footer-text {
        color: #ffffff;
        font-size: 0.9rem;
      }

      .footer-social-links {
        display: flex;
        gap: 1rem;
      }

      .footer-social-link {
        color: #ffffff;
        font-size: 1.2rem;
        text-decoration: none;
        transition: color 0.3s;
      }

      .footer-social-link:hover {
        color: #2196f3;
      }

      /* Responsive */
      @media (max-width: 968px) {
        .container {
          flex-direction: column;
          gap: 3rem;
        }

        .contact-left,
        .contact-right {
          width: 100%;
        }

        .page-title,
        .page-subtitle {
          text-align: center;
        }

        .contact-form {
          max-width: 600px;
          margin: 0 auto;
        }
      }

      @media (max-width: 768px) {
        .navbar {
          padding: 0.75rem 1rem;
          height: auto;
          background: rgba(26, 29, 36, 0.95);
          backdrop-filter: blur(10px);
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
          border-bottom: 1px solid rgba(33, 150, 243, 0.1);
          flex-wrap: wrap;
          align-items: center;
          display: flex;
          justify-content: space-between;
        }

        .nav-content {
          width: 100%;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1rem;
        }

        .logo-img {
          width: 45px;
          height: 45px;
          border: 2px solid #2196f3;
          border-radius: 8px;
          transition: transform 0.3s ease;
        }

        .logo:hover .logo-img {
          transform: scale(1.05);
        }

        .nav-links {
          flex-direction: column;
          gap: 0;
          position: fixed;
          top: 60px;
          left: 0;
          width: 100%;
          max-height: 0;
          overflow: hidden;
          background: linear-gradient(
            135deg,
            rgba(26, 29, 36, 0.99),
            rgba(28, 37, 65, 0.99)
          );
          backdrop-filter: blur(20px);
          transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
          border-top: 2px solid rgba(33, 150, 243, 0.2);
          z-index: 999;
        }

        .nav-links.active {
          max-height: 400px;
          padding: var(--spacing-lg);
          gap: var(--spacing-md);
        }

        .nav-links li {
          list-style: none;
          border-bottom: 1px solid rgba(33, 150, 243, 0.1);
          width: 100%;
        }

        .nav-links a {
          display: block;
          padding: 1rem var(--spacing-md);
          text-align: center;
          position: relative;
          font-weight: 600;
          letter-spacing: 0.5px;
          transition: all 0.3s ease;
          color: #ffffff;
        }

        .nav-links a::before {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          width: 0;
          height: 100%;
          background: rgba(33, 150, 243, 0.1);
          transition: width 0.3s ease;
          z-index: -1;
        }

        .nav-links a:hover::before {
          width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
          color: #2196f3;
          padding-left: 1.5rem;
        }

        .nav-links li:last-child {
          border-bottom: none;
        }

        .mobile-menu-toggle {
          display: flex;
          flex-direction: column;
          cursor: pointer;
          padding: 8px;
          gap: 4px;
          z-index: 1000;
        }

        .mobile-menu-toggle span {
          width: 26px;
          height: 2.5px;
          background: linear-gradient(90deg, #2196f3, #4895ef);
          border-radius: 3px;
          transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-menu-toggle.active span:nth-child(1) {
          transform: rotate(-45deg) translate(-7px, 7px);
          background: #2196f3;
        }

        .mobile-menu-toggle.active span:nth-child(2) {
          opacity: 0;
          transform: translateX(-10px);
        }

        .mobile-menu-toggle.active span:nth-child(3) {
          transform: rotate(45deg) translate(-6px, -6px);
          background: #2196f3;
        }

        .container {
          padding: 2rem 5%;
          flex-direction: column;
          gap: 2rem;
          margin-top: 0;
        }

        .page-title {
          font-size: 2.5rem;
        }

        .page-subtitle {
          font-size: 1rem;
        }

        .contact-left,
        .contact-right {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .navbar {
          padding: 0.6rem 0.75rem;
          height: 52px;
        }

        .mobile-menu-toggle {
          padding: 6px;
          gap: 3px;
        }

        .mobile-menu-toggle span {
          width: 24px;
          height: 2.5px;
        }

        .nav-content {
          gap: 0.5rem;
        }

        .logo-img {
          width: 38px;
          height: 38px;
          border: 1.5px solid #2196f3;
          border-radius: 5px;
        }

        .nav-links {
          top: 52px;
          max-height: 0;
          padding: 0;
        }

        .nav-links.active {
          max-height: 380px;
          padding: var(--spacing-sm);
        }

        .nav-links a {
          padding: 0.8rem var(--spacing-sm);
          font-size: 0.9rem;
        }

        .container {
          padding: 1.5rem 4%;
        }

        .page-title {
          font-size: 2rem;
        }

        .form-group input,
        .form-group textarea {
          padding: 0.875rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-content">
        <a href="index.html" class="logo">
          <img src="images/JAA.jpg" alt="JAA" class="logo-img" />
        </a>
        <div class="mobile-menu-toggle" id="mobileMenuToggle">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <ul class="nav-links" id="navLinks">
          <li><a href="about.html">About</a></li>
          <li><a href="project.html">Project</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <div class="contact-left">
        <img src="images/mine.png" alt="Joshua Ayotope" class="contact-image" />
      </div>

      <div class="contact-right">
        <h1 class="page-title">Get in Touch</h1>
        <p class="page-subtitle">
          Have a project in mind or just want to say hi? Fill out the form below
          and I'll get back to you as soon as possible.
        </p>

        <div class="contact-form">
          <form id="contactForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                placeholder="Your Message"
                required
              ></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-text">
          © 2024 Joshua Ayotope. All rights reserved.
        </div>
        <div class="footer-social-links">
          <a
            href="https://github.com/ayopium07"
            class="footer-social-link"
            title="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/Ayotope Joshua"
            class="footer-social-link"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a
            href="https://twitter.com/Thatuglyboy_7"
            class="footer-social-link"
            title="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>
          <a
            href="https://www.instagram.com/temisann7?igsh=ZTI3aGZ0enE1ZGFs"
            class="footer-social-link"
            title="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>

    <script>
      // Form submission handler
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form data
          const formData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value,
          };

          // Here you would typically send the data to a server
          console.log("Form submitted:", formData);

          // Show success message (you can customize this)
          alert("Thank you for your message! I will get back to you soon.");

          // Reset form
          this.reset();
        });

      // Smooth scroll animation
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px",
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = "1";
            entry.target.style.transform = "translateY(0)";
          }
        });
      }, observerOptions);

      document.querySelectorAll(".contact-form").forEach((element) => {
        element.style.opacity = "0";
        element.style.transform = "translateY(30px)";
        element.style.transition = "opacity 0.6s ease, transform 0.6s ease";
        observer.observe(element);
      });

      // Mobile menu toggle functionality
      const mobileMenuToggle = document.getElementById("mobileMenuToggle");
      const navLinks = document.getElementById("navLinks");

      mobileMenuToggle.addEventListener("click", function () {
        mobileMenuToggle.classList.toggle("active");
        navLinks.classList.toggle("active");
      });

      // Close mobile menu when clicking on a link
      const navLinksItems = navLinks.querySelectorAll("a");
      navLinksItems.forEach((link) => {
        link.addEventListener("click", function () {
          mobileMenuToggle.classList.remove("active");
          navLinks.classList.remove("active");
        });
      });

      // Close mobile menu when clicking outside
      document.addEventListener("click", function (event) {
        if (
          !mobileMenuToggle.contains(event.target) &&
          !navLinks.contains(event.target)
        ) {
          mobileMenuToggle.classList.remove("active");
          navLinks.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
