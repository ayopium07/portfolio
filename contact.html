<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Ayotope</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
          "Helvetica Neue", Arial, sans-serif;
        background-color: #1a1d24;
        color: #ffffff;
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Navigation */
      .navbar {
        background-color: #1a1d24;
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 1.5rem 8%;
        border-bottom: 1px solid #a0a0a0;
      }

      .nav-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        display: flex;
        align-items: center;
        text-decoration: none;
      }

      .logo-img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        border: 2px solid #2196f3;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }

      .nav-links a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: #2196f3;
      }

      /* Main Content */
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 4rem 8%;
        text-align: center;
      }

      .page-title {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      .page-subtitle {
        font-size: 1.1rem;
        color: #ffffff;
        margin-bottom: 3rem;
        max-width: 100%;
        font-weight: 400;
      }

      .contact-form {
        background-color: transparent;
        border: none;
        padding: 0;
        text-align: left;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #ffffff;
        font-weight: 500;
        font-size: 1rem;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 1rem;
        background-color: #2a2d34;
        border: 1px solid #2a2d34;
        border-radius: 8px;
        color: #ffffff;
        font-size: 1rem;
        transition: all 0.3s;
      }

      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: #a0a0a0;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #2196f3;
        background-color: #2a2d34;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 120px;
      }

      .submit-btn {
        background-color: #2196f3;
        color: #ffffff;
        border: none;
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        width: auto;
        float: right;
        margin-top: 1rem;
      }

      .submit-btn:hover {
        background-color: #1976d2;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.25);
      }

      /* Footer */
      .footer {
        background-color: #1a1d24;
        border-top: 1px solid #a0a0a0;
        padding: 2rem 8%;
        text-align: center;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .footer-text {
        color: #ffffff;
        font-size: 0.9rem;
      }

      .footer-social-links {
        display: flex;
        gap: 1rem;
      }

      .footer-social-link {
        color: #ffffff;
        font-size: 1.2rem;
        text-decoration: none;
        transition: color 0.3s;
      }

      .footer-social-link:hover {
        color: #2196f3;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .navbar {
          padding: 1rem 5%;
        }

        .nav-links {
          gap: 1rem;
        }

        .container {
          padding: 2rem 5%;
        }

        .page-title {
          font-size: 2.5rem;
        }

        .page-subtitle {
          font-size: 1rem;
        }
      }

      @media (max-width: 480px) {
        .navbar {
          padding: 1rem 4%;
        }

        .nav-links {
          gap: 0.5rem;
        }

        .container {
          padding: 1.5rem 4%;
        }

        .page-title {
          font-size: 2rem;
        }

        .form-group input,
        .form-group textarea {
          padding: 0.875rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-content">
        <a href="index.html" class="logo">
          <img src="images/JAA.jpg" alt="JAA" class="logo-img" />
        </a>
        <ul class="nav-links">
          <li><a href="about.html">About</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <h1 class="page-title">Get in Touch</h1>
      <p class="page-subtitle">
        Have a project in mind or just want to say hi? Fill out the form below
        and I'll get back to you as soon as possible.
      </p>

      <div class="contact-form">
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your Name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Your Message"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-text">
          © 2024 Joshua Ayotope. All rights reserved.
        </div>
        <div class="footer-social-links">
          <a
            href="https://github.com/ayopium07"
            class="footer-social-link"
            title="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/Ayotope Joshua"
            class="footer-social-link"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a
            href="https://twitter.com/Thatuglyboy_7"
            class="footer-social-link"
            title="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>
          <a
            href="https://www.instagram.com/temisann7?igsh=ZTI3aGZ0enE1ZGFs"
            class="footer-social-link"
            title="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>

    <script>
      // Form submission handler
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form data
          const formData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value,
          };

          // Here you would typically send the data to a server
          console.log("Form submitted:", formData);

          // Show success message (you can customize this)
          alert("Thank you for your message! I will get back to you soon.");

          // Reset form
          this.reset();
        });

      // Smooth scroll animation
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px",
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = "1";
            entry.target.style.transform = "translateY(0)";
          }
        });
      }, observerOptions);

      document.querySelectorAll(".contact-form").forEach((element) => {
        element.style.opacity = "0";
        element.style.transform = "translateY(30px)";
        element.style.transition = "opacity 0.6s ease, transform 0.6s ease";
        observer.observe(element);
      });
    </script>
  </body>
</html>
